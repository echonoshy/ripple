<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Ripple logo</title>
  <defs>
    <!-- Background glow gradients -->
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5ea6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff5ea6" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass card gradients -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.30"/>
    </linearGradient>

    <!-- Wave stroke gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#f0f3ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#dce4ff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6bff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5ea6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="glassBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#060713" flood-opacity="0.5"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base dark glass-metal background -->
  <rect width="512" height="512" rx="112" fill="#060814" />
  <rect width="512" height="512" rx="112" fill="url(#glassBorder)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" />

  <!-- Colorful vibrant mesh gradient blobs (behind the glass) -->
  <g filter="url(#blurFilter)">
    <!-- Top-left glowing cyan/blue sphere -->
    <circle cx="120" cy="120" r="150" fill="url(#glowBlue)" />
    <!-- Center-right purple sphere -->
    <circle cx="380" cy="220" r="180" fill="url(#glowPurple)" />
    <!-- Bottom-left glowing pink sphere -->
    <circle cx="180" cy="380" r="160" fill="url(#glowPink)" />
  </g>

  <!-- Semi-transparent glass dark-overlay to blend the colors smoothly -->
  <rect width="512" height="512" rx="112" fill="#0c0e25" fill-opacity="0.25" />

  <!-- Central Glassmorphic Shield -->
  <g filter="url(#shadowFilter)">
    <!-- Glass Shield Body -->
    <rect x="76" y="76" width="360" height="360" rx="80" fill="url(#glassFill)" />
    <!-- Glass Shield Border -->
    <rect x="76" y="76" width="360" height="360" rx="80" stroke="url(#glassBorder)" stroke-width="3.5" />
  </g>

  <!-- Glowing background for the ripple paths for subtle backlighting -->
  <g filter="url(#blurFilter)" opacity="0.35">
    <path
      d="M125 237C162 170 209 139 258 139C310 139 356 171 387 237"
      stroke="url(#waveGlow)"
      stroke-width="50"
      stroke-linecap="round"
    />
    <path
      d="M123 346L204 247C230 218 267 211 296 228C325 246 330 284 305 305C285 322 253 317 234 298"
      stroke="url(#waveGlow)"
      stroke-width="50"
      stroke-linecap="round"
    />
  </g>

  <!-- Main Wave Paths with high-quality white metallic gradient -->
  <g filter="url(#neonGlow)">
    <!-- Wave 1 (top arch) -->
    <path
      d="M125 237C162 170 209 139 258 139C310 139 356 171 387 237"
      stroke="url(#waveGrad)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Wave 2 (middle curve) -->
    <path
      d="M123 346L204 247C230 218 267 211 296 228C325 246 330 284 305 305C285 322 253 317 234 298"
      stroke="url(#waveGrad)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Wave 3 (bottom arch) -->
    <path
      d="M236 299L304 370C329 397 368 397 394 366"
      stroke="url(#waveGrad)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>