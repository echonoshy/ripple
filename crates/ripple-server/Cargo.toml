[package]
name = "ripple-server"
version = "0.1.0"
description = "Rust Ripple control-plane server"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.7", features = ["macros", "multipart"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mime_guess = "2"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.7.4", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
