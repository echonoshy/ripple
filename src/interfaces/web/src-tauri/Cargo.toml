[package]
name = "ripple-desktop"
version = "0.1.0"
description = "Ripple desktop shell"
authors = ["Ripple"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ripple_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

