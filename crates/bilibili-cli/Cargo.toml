[package]
name = "bilibili-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "bilibili"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "time"] }
url = "2"
