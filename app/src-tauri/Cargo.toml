[package]
name = "ripple-desktop"
version = "0.1.0"
description = "Ripple desktop shell"
authors = ["Ripple"]
edition = "2021"
rust-version = "1.77.2"

[workspace]

[lib]
name = "ripple_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
