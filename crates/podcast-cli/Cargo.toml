[package]
name = "podcast-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "podcast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }
url = "2"
